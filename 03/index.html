<!DOCTYPE html>

<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array</title>
   <script>

    let linguagens = Array();

    linguagens[0] = 'Dart';
    linguagens[1] = 'PHP';
    linguagens[2] = 'Java';
    linguagens[3] = 'Pyton';
    linguagens[4] = 'Perl';
    linguagens[5] = 'Ruby on Rails';
    linguagens[6] = 'C ++';

    function mostrarListaLiguagem(){
        const container = document.getElementById('minhaDiv');
            for (var i = 0; i < linguagens.length; i ++) {
                    var tag = '<h5>' + i + ' - ' + linguagens[i] + '</h5>';
                    container.innerHTML += tag;
            }

    }

    function posicaoLingugens(){
        var indice = prompt('Qual pisição da lista deseja consultar?');
        alert(linguagens[indice]);
    }
