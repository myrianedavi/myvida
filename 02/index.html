<html lang="pt-br">
<head>
    <title>JavaScript</title>
    <script type="text/javascript">
 

function calcularRaiz(arg){
    var raiz = Math.sqrt(arg);
    alert("A raiz quadrada de " + arg + " é " + raiz);
}


function escreveDiv(texto){
    document.getElementById("minhaDiv").innerHTML = texto;

}

function escreveDiv2(texto){
    texto = prompt('Digite um texto qualquer');
    document.getElementById("minhaDiv2").innerHTML = texto;

}


function escreverNumeros(){
    let n = prompt("Digite um numero n: ");
    n = parseInt(n);
    let divResultado = document.getElementById("resultadoDesafio");
    divResultado.innerHTML = "";
    if (isNaN(n) || n < 1){
    divResultado.innerHTML="Por favor, insira um numero valido maior ou igual a 1.";
    return;
    }

    for (let i = 1; 1 <= n; i++) {
        divResultado.innerHTML += i + " ";
    }

}

function escreverNumerosInput(){
    var input = document.getElementById("numeroInput");
    var n = parseInt(input.value);
    if (isNaN(n) || n <= 0) {
        alert("Por favor, insira um numero valido maior que zero");
        return;
    
    }
var div = document.getElementById("numerosInput");
div.innerHTML = "";
for (var i = 1; i <= n; i++) {
    div.innerHTMl += i + "<br>";
    }

}



    </script>
</head>
<body>
<h1>Raiz Quadrada</h1>

<button onclick="calcularRaiz(25)">Raiz de 25</button>
<button onclick="calcularRaiz(36)">Raiz de 36</button>
<button onclick="calcularRaiz(49)">Raiz de 49</button> <br><br>



<h1>Escrevendo na Div</h1>
<div id="minhaDiv"></div>
<button onclick="escreveDiv('<h1> Programação Web <h1/>')">Escrever</button> <br><br>



<hr>

<h1>Escrevendo na Texto Dinamico</h1>
<div id="minhaDiv2"></div>
<button onclick="escreveDiv2()">Escrever</button> <br><br>

<h1>Desafio</h1>
<button onclick="escreverNumeros">Escrever</button>
<hr>
<div id="resultadoDesafio"></div>




<hr>

<h1>Desafio com Input</h1>
<label for="numeroInput">Digite o valor de N:</label>
<input type="number" id="numeroInput" placeholder="Digite um numero" min="1">
<button onclick="escreverNumerosInput()">Escrever Numeros</button>

<br><br>

<div id="numeroInput"></div>


</body>
</html>
